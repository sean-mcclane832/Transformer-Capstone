<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADRIA</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ADRIA</h1>
            <p class="subtitle">Attention-Driven Recursive Inference Architecture</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="prompt">Prompt</label>
                <textarea id="prompt" rows="4" placeholder="Enter a prompt and click Generate..."></textarea>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="temperature">Temperature &nbsp;<span class="val-badge" id="temp-val">0.80</span></label>
                    <input type="range" id="temperature" min="0.1" max="2.0" step="0.05" value="0.8">
                </div>
                <div class="control-group">
                    <label for="top_p">Top-p &nbsp;<span class="val-badge" id="topp-val">0.90</span></label>
                    <input type="range" id="top_p" min="0.0" max="1.0" step="0.01" value="0.9">
                </div>
                <div class="control-group">
                    <label for="top_k">Top-k</label>
                    <input type="number" id="top_k" min="0" max="200" value="40">
                    <span class="hint">0 = disabled</span>
                </div>
                <div class="control-group">
                    <label for="max_tokens">Max new tokens</label>
                    <input type="number" id="max_tokens" min="1" max="1000" value="200">
                </div>
            </div>

            <div class="button-row">
                <button id="generate-btn" onclick="startGenerate()">Generate</button>
                <button id="clear-btn" onclick="clearOutput()">Clear</button>
            </div>
        </div>

        <div class="output-card">
            <div class="output-header">
                <span class="output-label">Output</span>
                <span id="status-badge" class="status-badge"></span>
            </div>
            <div id="output" class="output"></div>
        </div>
    </div>

    <script>
        let reader  = null;
        let streaming = false;

        // Live slider labels
        document.getElementById("temperature").addEventListener("input", e => {
            document.getElementById("temp-val").textContent = parseFloat(e.target.value).toFixed(2);
        });
        document.getElementById("top_p").addEventListener("input", e => {
            document.getElementById("topp-val").textContent = parseFloat(e.target.value).toFixed(2);
        });

        function setStatus(msg, cls) {
            const badge = document.getElementById("status-badge");
            badge.textContent = msg;
            badge.className = "status-badge " + (cls || "");
        }

        function setStreaming(on) {
            streaming = on;
            const btn = document.getElementById("generate-btn");
            btn.textContent = on ? "Stop" : "Generate";
            btn.onclick = on ? stopGenerate : startGenerate;
            btn.classList.toggle("stop", on);
        }

        function clearOutput() {
            document.getElementById("output").textContent = "";
            setStatus("", "");
        }

        async function startGenerate() {
            const prompt = document.getElementById("prompt").value.trim();
            if (!prompt) return;

            const params = {
                prompt,
                max_new_tokens : parseInt(document.getElementById("max_tokens").value),
                temperature    : parseFloat(document.getElementById("temperature").value),
                top_k          : parseInt(document.getElementById("top_k").value),
                top_p          : parseFloat(document.getElementById("top_p").value),
            };

            document.getElementById("output").textContent = "";
            setStreaming(true);
            setStatus("generating…", "active");

            try {
                const response = await fetch("/generate", {
                    method  : "POST",
                    headers : { "Content-Type": "application/json" },
                    body    : JSON.stringify(params),
                });

                if (!response.ok) {
                    throw new Error(`Server error ${response.status}`);
                }

                reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // keep incomplete trailing line

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const payload = JSON.parse(line.slice(6));
                        if (payload === "[DONE]") {
                            setStatus("done", "done");
                            setStreaming(false);
                            return;
                        }
                        document.getElementById("output").textContent += payload;
                    }
                }
            } catch (err) {
                if (streaming) {
                    document.getElementById("output").textContent += "\n[stream interrupted]";
                    setStatus("stopped", "");
                }
            } finally {
                setStreaming(false);
                reader = null;
            }
        }

        async function stopGenerate() {
            if (reader) {
                await reader.cancel();
                reader = null;
            }
            setStreaming(false);
            setStatus("stopped", "");
        }
    </script>
</body>
</html>
